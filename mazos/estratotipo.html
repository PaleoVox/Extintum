<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cartas aleatorias</title>
<style>
  body {
    font-family: Arial;
    text-align: center;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: white;
  }

  h2 { margin-top: 20px; }

  .card-container {
    perspective: 1000px;
    width: 220px;
    margin: 20px auto;
  }

  .card {
    width: 100%;
    aspect-ratio: 2/3;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s;
  }

  .card.flip {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    overflow: hidden;
  }

  .card-face::after {
    content: "";
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(120deg, rgba(255,255,255,0.2), rgba(255,255,255,0));
    transform: skewX(-20deg);
  }

  .card.flip .card-face::after {
    animation: shine 0.8s forwards;
  }

  @keyframes shine {
    0% { left: -75%; }
    100% { left: 125%; }
  }

  .front {
    transform: rotateY(180deg);
  }

  .back {
    background-image: url('estratotipos/reverso.png');
  }

  button {
    margin: 10px;
    padding: 12px 20px;
    border: none;
    border-radius: 25px;
    background: #ffcc00;
    color: #333;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }

  button:hover {
    background: #ffd633;
    transform: scale(1.05);
  }

  #info { margin-top: 15px; font-size: 18px; }
</style>
</head>
<body>

<h2>Mazo de estratotipos</h2>

<div class="card-container">
  <div class="card" id="card">
    <div class="card-face back"></div>
    <div class="card-face front" id="front"></div>
  </div>
</div>

<button onclick="drawCard()">Sacar carta</button>
<button onclick="resetDeck()">Reiniciar</button>

<p id="info"></p>

<script>
let deck = [];
let remaining = [];
let timeoutHandle;

function initDeck() {
  deck = [
    'estratotipos/1.png','estratotipos/2.png','estratotipos/3.png','estratotipos/4.png','estratotipos/5.png',
    'estratotipos/6.png','estratotipos/7.png','estratotipos/8.png','estratotipos/9.png','estratotipos/10.png'
  ];
  remaining = [...deck];
}

initDeck();

function drawCard() {
  if (remaining.length === 0) {
    document.getElementById('info').innerText = 'No quedan cartas';
    return;
  }

  clearTimeout(timeoutHandle);

  const card = document.getElementById('card');
  const front = document.getElementById('front');

  card.classList.remove('flip');

  setTimeout(() => {
    let index = Math.floor(Math.random() * remaining.length);
    let selected = remaining.splice(index, 1)[0];

    front.style.backgroundImage = `url('${selected}')`;

    card.classList.add('flip');

    document.getElementById('info').innerText = `Restan ${remaining.length} cartas`;

    // regresar al reverso después de unos segundos
    timeoutHandle = setTimeout(() => {
      card.classList.remove('flip');
    }, 5000);

  }, 200);
}

function resetDeck() {
  clearTimeout(timeoutHandle);
  initDeck();
  const card = document.getElementById('card');
  card.classList.remove('flip');
  document.getElementById('front').style.backgroundImage = '';
  document.getElementById('info').innerText = 'Baraja reiniciada';
}
</script>

</body>
</html>
